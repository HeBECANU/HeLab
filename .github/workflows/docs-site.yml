name: Docs site

# The user manual's site (Q54.2): one version per release on this repository's GitHub Pages (mike, on
# its gh-pages branch), so another copy of the repo (a fork) publishes its own. It runs only when a
# release is *published*: dev-cicd.yml's release job makes a draft, which stays private until it is
# published by hand, and an abandoned draft never reaches the site. Never on a push or a PR.
# Its versions (Q56.3, docs/publish/site_versions.py): every release is in the version menu; "latest" is
# the newest stable release and the site's front page; "pre-release" the newest alpha, beta or release
# candidate, removed by a newer stable release until the next pre-release; until there is a stable release the front page says so and links to the newest pre-release.
# No dev channel: a development manual is built locally (README). Help › User manual opens
# <owner>.github.io/<repo>/<version>/, the running version's page.

on:
  release:
    types: [published]

permissions:
  contents: write  # mike pushes to gh-pages

# One deploy at a time: each pushes a commit to gh-pages.
concurrency:
  group: helab-docs-site
  cancel-in-progress: false

jobs:
  docs-site:
    name: Publish the user manual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      HELAB_DOCS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      # A release of a commit from before the manual (an older tag's draft published late) has
      # nothing to deploy: skip with a notice, as ci-build.yml builds such a commit without it.
      - name: Check this commit has the manual
        id: manual
        run: |
          if [ -f mkdocs.yml ] && [ -f requirements-docs.lock ] && [ -f docs/publish/site_versions.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No user manual at $RELEASE_TAG: nothing to publish."
          fi

      - name: Set up Python
        if: steps.manual.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the docs tools
        if: steps.manual.outputs.present == 'true'
        run: pip install -r requirements-docs.lock

      - name: Deploy this release's manual with mike
        if: steps.manual.outputs.present == 'true'
        run: |
          version="${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || echo "No gh-pages branch yet: mike creates it."
          # Its version, "latest" or "pre-release" when it is the newest of its kind, and the front page.
          python docs/publish/site_versions.py "$version"
