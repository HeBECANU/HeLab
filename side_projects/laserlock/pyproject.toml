[project]
name = "laserlock"
version = "0.1.0"
description = "Locks a laser's frequency: reads a HighFinesse wavemeter, steers a Rigol DG1022's DC offset"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PyQt6>=6.6",
    "pyqtgraph>=0.13.7",
    "pyvisa>=1.14",  # the DG1022, through the installed NI-VISA (or Keysight VISA)
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
laserlock = "laserlock.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["laserlock"]
