<!DOCTYPE html>
<!-- The manual site's front page until there is a stable release (Q56.3, A59.2 (b)): mike's set-default
     template (docs/publish/site_versions.py). site_versions fills in {{latest}}, the newest pre-release and
     its kind ("0.0.8a1 (alpha)"), before mike renders {{href}}, that pre-release's manual (pre-release/). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeLab manual</title>
  <style>
    :root { color-scheme: light dark; --text: #1f2328; --muted: #59636e; --link: #3f51b5; --page: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #e6edf3; --muted: #9198a1; --link: #8c9eff; --page: #1e2129; }
    }
    body { margin: 0; background: var(--page); color: var(--text);
           font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 36rem; margin: 15vh auto 0; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
    p { margin: 0.5rem 0; }
    .latest { font-size: 1.2rem; margin: 0.25rem 0 1rem; }
    .note { color: var(--muted); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>HeLab manual</h1>
    <p class="latest">Latest: <a href="{{href}}">{{latest}}</a></p>
    <p>No stable release yet: HeLab has only pre-releases (alpha and beta versions) so far, and the newest is
      the latest download. Its manual's version menu lists every release.</p>
    <p class="note">HeLab's Help › User manual opens the manual of the version you run.</p>
  </main>
</body>
</html>
